name: audit

# pnpm audit reads pnpm-lock.yaml directly (npm audit needs a
# package-lock.json, which this repo does not have). The weekly run catches
# advisories published after a dependency was merged.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Runtime dependencies (shipped to users), any severity
        run: pnpm audit --prod
      - name: Full dependency tree, high and critical
        run: pnpm audit --audit-level=high
