name: Package Publish

# Releases are cut from version tags only. workflow_dispatch is kept for
# re-running a release, but both jobs refuse to run unless the selected ref
# is a v* tag, so a branch can never be published.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: package-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm run plugin:ci

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    # Granted to the reusable workflow's job: read the source and mint the
    # OIDC token ClawHub uses to verify the workflow source. Nothing else.
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@65248d7d93ce5686a43f22715d01f1e91e3ca572 # v20261028.pre.062526Z.pre.65248d7
    with:
      dry_run: false
      source: VACInc/openclaw-search-fusion
      ref: ${{ github.ref_name }}
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN || secrets.OPENCLAW_CLAWHUB_TOKEN }}
