name: Package Publish

# Releases are cut from version tags only. workflow_dispatch is kept for
# re-running a release, but both jobs refuse to run unless the selected ref
# is a v* tag, so a branch can never be published.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: package-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm run plugin:ci

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    # Granted to the reusable workflow's job: read the source and mint the
    # OIDC token ClawHub uses to verify the workflow source. Nothing else.
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@ecf09b868a986751137f4272283f84967a16c765 # v0.12.0
    with:
      dry_run: false
      source: VACInc/openclaw-search-fusion
      ref: ${{ github.ref_name }}
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN || secrets.OPENCLAW_CLAWHUB_TOKEN }}
